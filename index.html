<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BIM Showcase Hub</title>
    <script>
      (() => {
        let preference = null;
        try {
          const raw = localStorage.getItem("bsh-settings-v1");
          const stored = raw === null ? null : JSON.parse(raw);
          if (stored && typeof stored === "object") {
            if (stored.theme === "light" || stored.theme === "dark") {
              preference = stored.theme;
            } else if (stored.theme === "system") {
              preference = "system";
            }
          }
        } catch {
          preference = null;
        }
        if (preference === null) {
          try {
            const legacy = localStorage.getItem("bsh-theme");
            if (legacy === "light" || legacy === "dark") preference = legacy;
          } catch {
            preference = null;
          }
        }
        let theme = preference;
        if (theme !== "light" && theme !== "dark") {
          const light = window.matchMedia?.("(prefers-color-scheme: light)");
          theme = light?.matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
