<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#131416" />
    <title>BIM Showcase Hub</title>
    <script>
      (() => {
        let stored = null;
        try {
          const raw = localStorage.getItem("bsh-settings-v1");
          const parsed = raw === null ? null : JSON.parse(raw);
          if (parsed && typeof parsed === "object") stored = parsed;
        } catch {
          stored = null;
        }
        const themes = { dark: ["dark", "#131416"], light: ["light", "#ffffff"] };
        let theme = null;
        if (stored && typeof stored.theme === "string" && Object.hasOwn(themes, stored.theme)) {
          theme = stored.theme;
        }
        if (!theme) {
          const light = window.matchMedia?.("(prefers-color-scheme: light)");
          theme = light?.matches ? "light" : "dark";
        }
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = themes[theme][0];
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", themes[theme][1]);
        if (stored && (stored.density === "compact" || stored.density === "comfortable")) {
          root.dataset.density = stored.density;
        }
        if (stored) {
          const size =
            stored.textSize === 100 || stored.textSize === 112 || stored.textSize === 125
              ? String(stored.textSize)
              : stored.textSize === "large"
                ? "112"
                : stored.textSize === "small" || stored.textSize === "medium"
                  ? "100"
                  : null;
          if (size) root.dataset.textSize = size;
        }
        if (stored && stored.reducedMotion === true) {
          root.dataset.reducedMotion = "true";
        }
        if (stored && (stored.language === "en" || stored.language === "ru")) {
          root.lang = stored.language;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
